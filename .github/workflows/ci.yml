name: CI
on:
  pull_request:
  push:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        scala:
        - "3.x"
        java:
        - 17
        - 25
        include:
        - java: 25
          scala: "latest"
    steps:
    - uses: actions/checkout@v7.0.1
    - run: gh extension install github/gh-actions-lock
    - run: gh actions-lock --verify
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/setup-java@v6.3.0
      with:
        java-version: ${{matrix.java}}
        distribution: temurin
    - uses: sbt/setup-sbt@v1.5.15
    - uses: coursier/cache-action@v9.0.1
    - if: ${{ matrix.scala == 'latest' }}
      run: sbt -v
           --server
           "++ 3.10.1!"
           scalafmtCheckRepo
           "all allJVM/Test/compile allJS/Test/compile"
           "allJVM/testFull"
           "allJS/testFull"
    - if: ${{ matrix.scala != 'latest' }}
      run: sbt -v
           --server
           "++ ${{ matrix.scala }} -v"
           scalafmtCheckRepo
           "Test/compile"
           "all scalafixCheckAll scalafixConfigRuleNamesSortCheck"
           "testFull"
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.3.0
      with:
        java-version: 21
        distribution: temurin
    - uses: sbt/setup-sbt@v1.5.15
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 26
    - uses: coursier/cache-action@v9.0.1
    - run: sbt -v
           --server
           -Dscala_js_wasm
           "project allJS"
           "Test/compile"
           "testFull"
  push_gh_pages:
    needs:
    - test
    - wasm
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'atnos-org' && github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    steps:
    - uses: actions/setup-java@v6.3.0
      with:
        java-version: 17
        distribution: temurin
    - uses: sbt/setup-sbt@v1.5.15
    - uses: actions/checkout@v7.0.1
    - name: Install pandoc
      run: ./.github/install_pandoc.sh
    - uses: coursier/cache-action@v9.0.1
    - name: Generate html
      run: ./.github/gen_doc.sh
    - name: Push to gh-pages
      uses: JamesIves/github-pages-deploy-action@v4.9.0
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: doc/target/specs2-reports/site
        CLEAN: true
